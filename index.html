<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazeless: The Blinder Database</title>
    <style>
        :root { --bg-dark: #121212; --panel-bg: #1e1e1e; --text-main: #e0e0e0; --crimson: #b30000; --sky-blue: #4da6ff; --hollow-gray: #777777; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 15px; }
        .header { text-align: center; border-bottom: 2px solid var(--panel-bg); padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
        .subtitle { font-size: 12px; color: var(--hollow-gray); letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #000; padding: 5px; border-radius: 8px; overflow-x: auto; }
        .tab { flex: 1; min-width: 80px; text-align: center; padding: 10px 5px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; background: transparent; color: var(--hollow-gray); white-space: nowrap; }
        .tab.active { background: var(--panel-bg); color: #fff; }
        .panel { background: var(--panel-bg); border-radius: 12px; padding: 20px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .panel.active { display: block; }
        .entry { margin-bottom: 25px; border-bottom: 1px solid #2a2a2a; padding-bottom: 15px; position: relative; }
        .entry:last-child { border: none; }
        .entry h3 { margin: 0 0 10px 0; font-size: 18px; }
        .category-label { display: inline-block; padding: 2px 6px; font-size: 10px; font-weight: bold; border-radius: 4px; text-transform: uppercase; margin-bottom: 8px; }
        .crimson { color: var(--crimson); } .crimson-bg { background: rgba(179,0,0,0.15); color: var(--crimson); border: 1px solid var(--crimson); }
        .blue { color: var(--sky-blue); } .blue-bg { background: rgba(77,166,255,0.15); color: var(--sky-blue); border: 1px solid var(--sky-blue); }
        .hollow { color: #fff; } .hollow-bg { background: rgba(119,119,119,0.15); color: #fff; border: 1px solid var(--hollow-gray); }
        
        /* Injector Console Styles */
        .console-btn { background: #333; color: #fff; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .console-panel { background: #151515; border: 1px dashed #444; border-radius: 8px; padding: 15px; margin-top: 15px; display: none; }
        textarea { width: 100%; height: 100px; background: #000; color: #00ff00; font-family: monospace; border: 1px solid #333; padding: 10px; box-sizing: border-box; resize: vertical; border-radius: 4px; }
        .inject-btn { background: #0066cc; color: white; border: none; padding: 8px 15px; border-radius: 4px; margin-top: 10px; cursor: pointer; font-weight: bold; }
        .clear-btn { background: #555; color: white; border: none; padding: 8px 15px; border-radius: 4px; margin-top: 10px; cursor: pointer; float: right; }
        .delete-btn { position: absolute; top: 0; right: 0; background: none; border: none; color: #ff4444; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">GAZELESS</div>
        <div class="subtitle">The Blinder Dashboard</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('gazes')">THE GAZES</button>
        <button class="tab" onclick="switchTab('messengers')">MESSENGERS</button>
        <button class="tab" onclick="switchTab('endings')">END ROUTES</button>
    </div>

    <div id="gazes" class="panel active"></div>
    <div id="messengers" class="panel"></div>
    <div id="endings" class="panel"></div>

    <!-- Developer Chat Injector Console -->
    <button class="console-btn" onclick="toggleConsole()">🛠️ OPEN CHAT DATA INJECTOR</button>
    <div id="consolePanel" class="console-panel">
        <p style="margin-top:0; font-size:12px; color:var(--hollow-gray);">Paste the update block generated by your AI chat session below:</p>
        <textarea id="payloadInput" placeholder='[{"tab":"gazes","alignment":"crimson","title":"New Area","description":"Details here..."}]'></textarea>
        <button class="inject-btn" onclick="injectData()">Sync Chat Ideas</button>
        <button class="clear-btn" onclick="clearDatabase()">Reset Wiki</button>
    </div>

    <script>
        // Baseline Hardcoded Lore Architecture
        const baseLore = [
            { tab: "gazes", alignment: "crimson", title: "🔴 The Crimson Gaze", description: "The Age of the Flayed Horizon: A blood-red sun eye locks at the zenith. Passive stamina regen is disabled—you must hit exposed enemy weaknesses to recover energy." },
            { tab: "gazes", alignment: "blue", title: "🙈 The Averting Gaze", description: "The Age of the Blind Zenith: An eerie, permanent clear sky-blue noon. The world looks pristine, but structures are illusory. Hitboxes hide grotesque true shapes." },
            { tab: "gazes", alignment: "hollow", title: "🌑 The Hollow Gaze", description: "The Age of the Ashen Canvas: A black hole void draining all color. Focuses entirely on weight, momentum, and poise. Glitched terrain intersects the plains." },
            { tab: "messengers", alignment: "crimson", title: "🐛 The Crimson Flayed Scholar", description: "A giant, non-human, segmented biological centipede creature that wraps around the checkpoints, violently piercing your flesh to channel levels." },
            { tab: "messengers", alignment: "blue", title: "🪷 The Nun of the Blue Lily", description: "A serene, white-veiled priestess with blue spider lilies blooming directly out of her empty eye sockets. Offers blind amnesia and deceptive comfort." },
            { tab: "messengers", alignment: "hollow", title: "🧵 The Stitched Devotee", description: "A multi-mouthed eldritch woman whose joints tear open to reveal stretching flesh. She is completely hollow, obsessed with you, and views you as her entire reality." },
            { tab: "endings", alignment: "crimson", title: "🔴 Crimson Gaze Branches", description: "Includes 'The Flayed Tyrant' (pure truth submission), 'The Fractured Lens' (decentralized anarchy with eyes in all flesh), and 'The Martyr's Veil' (living filter)." },
            { tab: "endings", alignment: "blue", title: "🙈 Averting Gaze Branches", description: "Includes 'Golden Anesthesia' (absolute delusion), 'The Cracking Mirror' (glitching broken illusion), and 'The Inherited Dream' (taking the throne)." }
        ];

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleConsole() {
            const panel = document.getElementById('consolePanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function renderWiki() {
            // Reset Panels
            document.getElementById('gazes').innerHTML = '';
            document.getElementById('messengers').innerHTML = '';
            document.getElementById('endings').innerHTML = '';

            // Get injected data from local storage or fallback to base lore
            const injectedData = JSON.parse(localStorage.getItem('gazeless_injected_lore')) || [];
            const masterList = [...baseLore, ...injectedData];

            masterList.forEach((item, index) => {
                const isCustom = index >= baseLore.length;
                const targetPanel = document.getElementById(item.tab);
                if (!targetPanel) return;

                const bgClass = item.alignment === 'crimson' ? 'crimson-bg' : (item.alignment === 'blue' ? 'blue-bg' : 'hollow-bg');
                const txtClass = item.alignment === 'crimson' ? 'crimson' : (item.alignment === 'blue' ? 'blue' : 'hollow');

                const entryHtml = `
                    <div class="entry">
                        <span class="category-label ${bgClass}">${item.alignment}</span>
                        <h3 class="${txtClass}">${item.title}</h3>
                        <p>${item.description}</p>
                        ${isCustom ? `<button class="delete-btn" onclick="deleteItem(${index - baseLore.length})">✕</button>` : ''}
                    </div>
                `;
                targetPanel.innerHTML += entryHtml;
            });
        }

        function injectData() {
            const rawInput = document.getElementById('payloadInput').value.trim();
            if(!rawInput) return alert("Please paste an update block first!");
            try {
                const newItems = JSON.parse(rawInput);
                const currentInjected = JSON.parse(localStorage.getItem('gazeless_injected_lore')) || [];
                const updatedList = [...currentInjected, ...(Array.isArray(newItems) ? newItems : [newItems])];
                
                localStorage.setItem('gazeless_injected_lore', JSON.stringify(updatedList));
                document.getElementById('payloadInput').value = '';
                renderWiki();
                alert("Synchronized! Check your wiki categories.");
            } catch(e) {
                alert("Invalid payload structure. Ensure you copy the complete array string block perfectly from your chat.");
            }
        }

        function deleteItem(customIndex) {
            const currentInjected = JSON.parse(localStorage.getItem('gazeless_injected_lore')) || [];
            currentInjected.splice(customIndex, 1);
